# The BlueForest theme for kitty.
#
# It is a kitty configuration file with the colours of the theme, and it is
# also a kitty theme: the metadata below is what `kitty +kitten themes` reads
# to name the theme and to tell who wrote it.
#
# The colours are the ones of BlueForest: the blue of the keywords, the green
# of the strings, the amber of the operators, the red of the numbers, and the
# pale yellow of the variables.

## name:     BlueForest
## author:   A. Alonso Dominguez
## license:  CC BY 4.0
## upstream: https://github.com/alonsodomin/blueforest-theme
## blurb:    A dark blue theme inspired by the BlueForest IntelliJ theme.

# The basic colours
foreground              #D0D0D0
background              #141F2E
selection_foreground    #141F2E
selection_background    #375780

# Cursor colours
cursor                  #D0D0D0
cursor_text_color       #141F2E

# URL underline colour when hovering with the mouse
url_color               #91CCFF

# Kitty window border colours
active_border_color     #0099FF
inactive_border_color   #56697D
bell_border_color       #FF8080

# OS window titlebar colours
wayland_titlebar_color  background
macos_titlebar_color    background

# Tab bar colours
active_tab_foreground   #D0D0D0
active_tab_background   #141F2E
inactive_tab_foreground #56697D
inactive_tab_background #0A101D
tab_bar_background      #1B2B40

# Colours for marks (marked text in the terminal)
mark1_foreground #141F2E
mark1_background #375780
mark2_foreground #141F2E
mark2_background #4FD6A0
mark3_foreground #141F2E
mark3_background #FFCC33

# The 16 terminal colours

# black
color0 #1B2B40
color8 #56697D

# red
color1 #B02A28
color9 #FF8080

# green
color2  #219186
color10 #80FF80

# yellow
color3  #B3871F
color11 #FFCC33

# blue
color4  #0099FF
color12 #91CCFF

# magenta
color5  #C57633
color13 #DDBB88

# cyan
color6  #1B7A70
color14 #4FD6A0

# white
color7  #7F8FA3
color15 #D0D0D0
