# The light variant of the BlueForest theme for kitty.
#
# It is a kitty configuration file with the colours of the theme, and it is
# also a kitty theme: the metadata below is what `kitty +kitten themes` reads
# to name the theme and to tell who wrote it.
#
# The colours are the ones of the light palette of BlueForest: the blue of
# the keywords, the green of the strings, the amber of the operators, the red
# of the numbers, and the soft grey of the variables.

## name:     BlueForest Light
## author:   A. Alonso Dominguez
## license:  CC BY 4.0
## upstream: https://github.com/alonsodomin/blueforest-theme
## blurb:    A light blue theme inspired by the BlueForest IntelliJ theme.

# The basic colours
foreground              #141F2E
background              #E8ECF2
selection_foreground    #E8ECF2
selection_background    #C9CDD3

# Cursor colours
cursor                  #141F2E
cursor_text_color       #E8ECF2

# URL underline colour when hovering with the mouse
url_color               #3A5F8A

# Kitty window border colours
active_border_color     #3A5F8A
inactive_border_color   #56697D
bell_border_color       #B02A28

# OS window titlebar colours
wayland_titlebar_color  background
macos_titlebar_color    background

# Tab bar colours
active_tab_foreground   #141F2E
active_tab_background   #E8ECF2
inactive_tab_foreground #56697D
inactive_tab_background #E0E4EA
tab_bar_background      #E0E4EA

# Colours for marks (marked text in the terminal)
mark1_foreground #E8ECF2
mark1_background #C9CDD3
mark2_foreground #E8ECF2
mark2_background #1B7A70
mark3_foreground #E8ECF2
mark3_background #C57633

