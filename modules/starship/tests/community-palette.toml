# A palette shaped like the one the community catalogue of Noctalia writes for
# Starship, with the colours of BlueForest.
#
# The catalogue renders its palette from the active palette of Noctalia, and
# the template it renders is:
#
#   https://github.com/noctalia-dev/community-templates/blob/main/starship/starship.toml
#
# The names of the keys are the ones of that template, and the colours are
# the ones of the terminal of BlueForest. The check of the repository renders
# the preset of the repository with it, so that the preset is proved to paint
# with the palette of the catalogue and not only with the palettes of the
# repository.
[palettes.noctalia]
blue = "#0099FF"
red = "#B02A28"
green = "#219186"
yellow = "#B3871F"
cyan = "#1B7A70"
magenta = "#C57633"
white = "#7F8FA3"
black = "#233244"
rosewater = "#FFCC33"
flamingo = "#FF8080"
pink = "#DDBB88"
mauve = "#C57633"
maroon = "#FF8080"
peach = "#FFCC33"
teal = "#1B7A70"
sky = "#4FD6A0"
sapphire = "#91CCFF"
lavender = "#DDBB88"
text = "#D0D0D0"
subtext1 = "#7F8FA3"
subtext0 = "#56697D"
overlay2 = "#56697D"
overlay1 = "#56697D"
overlay0 = "#233244"
surface2 = "#233244"
surface1 = "#233244"
surface0 = "#141F2E"
base = "#141F2E"
mantle = "#141F2E"
crust = "#141F2E"
