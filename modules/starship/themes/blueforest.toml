add_newline = true
format = "[░▒▓](fg:blue)$os$username[](bg:mantle fg:blue)$directory[](fg:mantle bg:surface1)$git_branch$git_status[](fg:surface1 bg:crust)$nodejs$python$rust$golang$java$scala$php$ruby$bun$deno$docker_context$terraform$aws[](fg:crust)$fill$cmd_duration$nix_shell$line_break$character"

[aws]
format = "[[ $symbol ($profile) ](fg:peach bg:crust)]($style)"
style = "bg:crust"
symbol = " (AWS)"

[bun]
format = "[[ $symbol ($version) ](fg:green bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[character]
error_symbol = "[❯](bold fg:flamingo)"
success_symbol = "[❯](bold fg:blue)"

[cmd_duration]
format = "[ 󰔛 $duration ]($style)"
min_time = 1000
show_milliseconds = false
show_notifications = false
style = "fg:peach"

[deno]
format = "[[ $symbol ($version) ](fg:green bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[directory]
format = "[ $path ]($style)"
style = "fg:text bg:mantle"
truncate_to_repo = true
truncation_length = 5
truncation_symbol = ".../"

[docker_context]
format = "[[ $symbol ($context) ](fg:text bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[fill]
symbol = " "
style = ""

[git_branch]
format = "[[ $symbol $branch ](fg:peach bg:surface1)]($style)"
style = "bg:surface1"
symbol = ""

[git_status]
format = "[[($all_status$ahead_behind )](fg:peach bg:surface1)]($style)"
style = "bg:surface1"

[golang]
format = "[[ $symbol ($version) ](fg:green bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[java]
format = "[[ $symbol ($version) ](fg:flamingo bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[nix_shell]
format = "[](fg:crust)[[ $symbol$state( \\($name\\)) ](fg:text bg:crust)]($style)"
style = "bg:crust"
symbol = " "

[nodejs]
format = "[[ $symbol ($version) ](fg:green bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:blue fg:base"

[php]
format = "[[ $symbol ($version) ](fg:text bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[python]
format = "[[ $symbol ($version) ](fg:green bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[ruby]
format = "[[ $symbol ($version) ](fg:flamingo bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[rust]
format = "[[ $symbol ($version) ](fg:green bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[scala]
format = "[[ $symbol ($version) ](fg:flamingo bg:crust)]($style)"
style = "bg:crust"
symbol = ""

[terraform]
format = "[[ $symbol ($workspace) ](fg:text bg:crust)]($style)"
style = "bg:crust"
symbol = "󱁢"

[username]
format = "[$user]($style)"
show_always = true
style_root = "bg:blue fg:flamingo"
style_user = "bg:blue fg:base"
