add_newline = true
format = "[░▒▓](fg:primary)$os$username[](bg:surface fg:primary)$directory[](fg:surface bg:surface_variant)$git_branch$git_status[](fg:surface_variant bg:hover)$nodejs$python$rust$golang$java$scala$php$ruby$bun$deno$docker_context$terraform$aws[](fg:hover)$line_break$character"
right_format = "$cmd_duration$nix_shell"

[aws]
format = "[[ $symbol ($profile) ](fg:tertiary bg:hover)]($style)"
style = "bg:hover"
symbol = " (AWS)"

[bun]
format = "[[ $symbol ($version) ](fg:success bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[character]
error_symbol = "[❯](bold fg:error)"
success_symbol = "[❯](bold fg:primary)"

[cmd_duration]
format = "[ 󰔛 $duration ]($style)"
min_time = 1000
show_milliseconds = false
show_notifications = false
style = "fg:tertiary"

[deno]
format = "[[ $symbol ($version) ](fg:success bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[directory]
format = "[ $path ]($style)"
style = "fg:secondary bg:surface"
truncate_to_repo = true
truncation_length = 5
truncation_symbol = ".../"

[docker_context]
format = "[[ $symbol ($context) ](fg:secondary bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[git_branch]
format = "[[ $symbol $branch ](fg:tertiary bg:surface_variant)]($style)"
style = "bg:surface_variant"
symbol = ""

[git_status]
format = "[[($all_status$ahead_behind )](fg:tertiary bg:surface_variant)]($style)"
style = "bg:surface_variant"

[golang]
format = "[[ $symbol ($version) ](fg:success bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[java]
format = "[[ $symbol ($version) ](fg:error bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[nix_shell]
format = "[](fg:hover)[[ $symbol$state( \\($name\\)) ](fg:secondary bg:hover)]($style)"
style = "bg:hover"
symbol = " "

[nodejs]
format = "[[ $symbol ($version) ](fg:success bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:primary fg:on_primary"

[php]
format = "[[ $symbol ($version) ](fg:secondary bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[python]
format = "[[ $symbol ($version) ](fg:success bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[ruby]
format = "[[ $symbol ($version) ](fg:error bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[rust]
format = "[[ $symbol ($version) ](fg:success bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[scala]
format = "[[ $symbol ($version) ](fg:error bg:hover)]($style)"
style = "bg:hover"
symbol = ""

[terraform]
format = "[[ $symbol ($workspace) ](fg:secondary bg:hover)]($style)"
style = "bg:hover"
symbol = "󱁢"

[username]
format = "[$user]($style)"
show_always = true
style_root = "bg:primary fg:error"
style_user = "bg:primary fg:on_primary"
