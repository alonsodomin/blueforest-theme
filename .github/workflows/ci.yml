# To make changes, edit the workflow definition in your flake's actions-nix configuration
# (typically under flake.actions-nix.workflows.".github/workflows/ci.yml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  checks:
    if: always()
    name: Checks (${{ matrix.flake }})
    needs:
    - render
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - env:
        BLUEFOREST_NEOVIM_NIXVIM_CHECK: '1'
        BLUEFOREST_VSCODE_INTEGRATION_CHECK: '1'
      name: Run flake checks
      run: nix flake check --impure ${{ matrix.flake }}
    strategy:
      fail-fast: false
      matrix:
        flake:
        - path:.
        - path:./modules/vscode
        - path:./modules/bat
        - path:./modules/starship
        - path:./modules/opencode
        - path:./modules/sbt
        - path:./modules/neovim
        - path:./modules/eza
        - path:./modules/zed
        - path:./modules/yazi
        - path:./modules/kitty
        - path:./modules/mkdocs
        - path:./modules/claude-code
        - path:./modules/btop
        - path:./modules/lazygit
        - path:./modules/md-tui
        - path:./modules/noctalia
  conventional:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Check the commit messages
      run: |-
        # The commits of the pull request, or the commits of the push.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          range="${{ github.event.pull_request.base.sha }}..HEAD"
        else
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="$before..${{ github.event.after }}"
          fi
        fi

        # The merge commits are ignored: a repository with a linear
        # history has none of them, and a merge commit says nothing
        # about the change it brings.
        nix run .#cog -- check --ignore-merge-commits "$range"
  merge-gate:
    if: always()
    name: Merge gate
    needs:
    - checks
    - conventional
    runs-on: ubuntu-latest
    steps:
    - name: Check the result of the checks
      run: |-
        if [ "${{ needs.checks.result }}" != "success" ]; then
          echo "the checks did not pass: ${{ needs.checks.result }}" >&2
          exit 1
        fi

        if [ "${{ needs.conventional.result }}" != "success" ]; then
          echo "the commit messages did not pass: ${{ needs.conventional.result }}" >&2
          exit 1
        fi
  render:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository
    name: Render the workflows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Render the workflows
      run: nix run .#render-workflows
    - name: Commit the workflows
      run: |-
        if git diff --quiet -- .github/workflows; then
          echo "The workflows are already rendered."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit --all --message "Render the workflows"
        # The ${ is the escape of an indented string: it writes the
        # expression of GitHub, and not an interpolation of Nix.
        git push origin "HEAD:refs/heads/${github.event.pull_request.head.ref }}"
name: CI
'on':
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
