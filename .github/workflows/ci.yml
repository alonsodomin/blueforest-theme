# This file was autogenerated by actions.nix. Do not edit it manually.
# To make changes, edit the workflow definition in your flake's actions-nix configuration
# (typically under flake.actions-nix.workflows.".github/workflows/ci.yml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  checks:
    name: Checks (${{ matrix.flake }})
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - env:
        BLUEFOREST_NEOVIM_NIXVIM_CHECK: '1'
        BLUEFOREST_SKIP_WORKFLOWS_CHECK: ${{ github.event_name == 'pull_request' &&
          '1' || '' }}
        BLUEFOREST_VSCODE_INTEGRATION_CHECK: '1'
      name: Run flake checks
      run: nix flake check --impure ${{ matrix.flake }}
    strategy:
      fail-fast: false
      matrix:
        flake:
        - .
        - ./modules/vscode
        - ./modules/bat
        - ./modules/starship
        - ./modules/opencode
        - ./modules/sbt
        - ./modules/neovim
        - ./modules/eza
        - ./modules/zed
  render:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
      == github.repository
    name: Render the workflows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.ref }}
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Render the workflows
      run: nix run .#render-workflows
    - name: Commit the workflows
      run: |-
        if git diff --quiet -- .github/workflows; then
          echo "The workflows are already rendered."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit --all --message "Render the workflows"
        # The ${ is the escape of an indented string: it writes the
        # expression of GitHub, and not an interpolation of Nix.
        git push origin "HEAD:refs/heads/${github.event.pull_request.head.ref }}"
  submodule:
    name: Check the submodule
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Check that the submodule and the pin agree
      run: |-
        pinned="$(nix eval --raw .#zedRevision)"
        submodule="$(git ls-tree HEAD modules/zed/extension | awk '{print $3}')"

        if [ "$pinned" != "$submodule" ]; then
          echo "the submodule of the extension of Zed is at $submodule, and the sources of the package are pinned at $pinned" >&2
          exit 1
        fi
name: CI
'on':
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
