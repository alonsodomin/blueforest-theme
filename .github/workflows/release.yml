          exit 1
        fi

        echo "version=$version" >>"$GITHUB_OUTPUT"
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Package the theme
      run: |-
        rm -rf staging
        mkdir -p dist staging
        mkdir -p "staging/plugins"
        cp "modules/sbt/config/sbt-prompt.sbt" "staging/plugins/sbt-prompt.sbt"

        mkdir -p "staging/."
        cp "modules/sbt/config/blueforest-prompt.sbt" "staging/blueforest-prompt.sbt"


        # The changelog of the application, when it has one.
        if [ -f "modules/sbt/CHANGELOG.md" ]; then
          cp "modules/sbt/CHANGELOG.md" "staging/CHANGELOG.txt"
        fi

        tar -czf "dist/blueforest-sbt-theme-$VERSION.tar.gz" \
          -C staging --files-from <(ls -A staging)
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        VERSION: ${{ steps.version.outputs.version }}
      name: Upload the asset to the release
      run: gh release upload "$TAG" "dist/blueforest-sbt-theme-$VERSION.tar.gz" --clobber
