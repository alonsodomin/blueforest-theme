        cp -r "modules/yazi/themes/blueforest.yazi" "staging/blueforest.yazi"

        mkdir -p "staging/."
        cp -r "modules/yazi/themes/blueforest-light.yazi" "staging/blueforest-light.yazi"

        mkdir -p "staging/blueforest.yazi"
        cp "modules/bat/themes/BlueForest.tmTheme" "staging/blueforest.yazi/tmtheme.xml"

        mkdir -p "staging/blueforest-light.yazi"
        cp "modules/bat/themes/BlueForestLight.tmTheme" "staging/blueforest-light.yazi/tmtheme.xml"


        # The changelog of the application, when it has one.
        if [ -f "modules/yazi/CHANGELOG.md" ]; then
          cp "modules/yazi/CHANGELOG.md" "staging/CHANGELOG.txt"
        fi

        tar -czf "dist/blueforest-yazi-theme-$VERSION.tar.gz" \
