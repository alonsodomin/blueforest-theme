    steps:
    - uses: actions/checkout@v7
    - id: setup
      name: Setup
      run: |-
        version=$(cat modules/bat/VERSION)
        echo "tag: bat/$version"
        echo "tag=bat/$version" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Package the theme
      run: cp modules/bat/themes/BlueForest.tmTheme ./blueforest-bat-theme-${{ steps.setup.outputs.version
