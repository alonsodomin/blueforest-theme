        tar -czf "dist/blueforest-yazi-theme-$VERSION.tar.gz" \
          -C staging --files-from <(ls -A staging)
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v${{ needs.version.outputs.version }}
        VERSION: ${{ needs.version.outputs.version }}
      name: Upload the asset to the release
      run: gh release upload "$TAG" "dist/blueforest-yazi-theme-$VERSION.tar.gz" --clobber
  zed:
    name: 'Zed: Package'
    needs:
    - version
    - create-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - env:
        VERSION: ${{ needs.version.outputs.version }}
      name: Package the theme
      run: |-
        rm -rf staging
        mkdir -p dist staging
        mkdir -p "staging/."
        cp "modules/zed/extension/extension.toml" "staging/extension.toml"

        mkdir -p "staging/themes"
        cp "modules/zed/extension/themes/blueforest.json" "staging/themes/blueforest.json"


        # The changelog of the application, when it has one.
        if [ -f "modules/zed/CHANGELOG.md" ]; then
          cp "modules/zed/CHANGELOG.md" "staging/CHANGELOG.txt"
        fi

        tar -czf "dist/blueforest-zed-theme-$VERSION.tar.gz" \
          -C staging --files-from <(ls -A staging)
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v${{ needs.version.outputs.version }}
        VERSION: ${{ needs.version.outputs.version }}
      name: Upload the asset to the release
      run: gh release upload "$TAG" "dist/blueforest-zed-theme-$VERSION.tar.gz" --clobber
name: Release
'on':
  push:
    tags:
    - v*
