  zed:
    name: 'Zed: Package'
    needs:
    - create-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install CoCoGitto
      uses: cocogitto/cocogitto-action@v4
      with:
        install-only: true
    - id: version
      name: Read the version of the application
      run: |-
        version=$(cog get-version --package zed -f "$(cog get-version |& tail -1)" |& tail -1)

        if [ -z "$version" ]; then
          echo "The version of zed is empty" >&2
          exit 1
        fi

        echo "version=$version" >>"$GITHUB_OUTPUT"
    - name: Fetch the extension of Zed
      run: |-
        rev=$(jq -r '.nodes."zed-extension".locked.rev' flake.lock)
        if [ -z "$rev" ] || [ "$rev" = "null" ]; then
          echo "the lock file does not pin the extension of Zed" >&2
          exit 1
        fi

        mkdir -p extension
        curl -fsSL "https://github.com/alonsodomin/zed-blueforest-theme/archive/$rev.tar.gz" \
          | tar -xz --strip-components=1 -C extension
    - env:
        VERSION: ${{ steps.version.outputs.version }}
      name: Package the theme
      run: |-
        rm -rf staging
        mkdir -p dist staging
        mkdir -p "staging/."
        cp "extension/extension.toml" "staging/extension.toml"

        mkdir -p "staging/themes"
        cp "extension/themes/blueforest.json" "staging/themes/blueforest.json"


        # The changelog of the application, when it has one.
        if [ -f "modules/zed/CHANGELOG.md" ]; then
          cp "modules/zed/CHANGELOG.md" "staging/CHANGELOG.txt"
        fi

        tar -czf "dist/blueforest-zed-theme-$VERSION.tar.gz" \
          -C staging --files-from <(ls -A staging)
    - env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        VERSION: ${{ steps.version.outputs.version }}
      name: Upload the asset to the release
      run: gh release upload "$TAG" "dist/blueforest-zed-theme-$VERSION.tar.gz" --clobber
