#
# The dependency updates of the repository.
#
# The repository is a flake with a flake of its own per application, so every
# application has a lock file of its own. Dependabot watches them all, and it
# groups the updates by the name of the dependency, so that a pull request
# carries the lock files of every application that share the dependency.
version: 2

updates:
  # The inputs of the flakes of the repository and of its applications.
  #
  # The actions of the workflows are updated by Renovate, not by Dependabot:
  # the workflows are rendered from their definitions in `workflows/`, and
  # Dependabot only reads workflow files. The configuration of Renovate is in
  # `renovate.json5`.
  - package-ecosystem: "nix"
    directories:
      - "/"
      - "/modules/*"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      flake-inputs:
        group-by: dependency-name
