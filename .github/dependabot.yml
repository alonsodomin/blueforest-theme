#
# The dependency updates of the repository.
#
# The repository is a flake, and the applications are modules of it, so there
# is one lock file, the one of the root flake. Dependabot watches it, and it
# groups the updates by the name of the dependency, so that a pull request
# carries every input that shares the dependency.
#
# Dependabot cannot enable the auto-merge of its own pull requests, so the
# workflow of `.github/workflows/dependabot.yml` does it for them: GitHub
# merges them when the checks of the repository have passed.
version: 2

updates:
  # The inputs of the flake of the repository.
  #
  # The actions of the workflows are updated by Renovate, not by Dependabot:
  # the workflows are rendered from their definitions in `workflows/`, and
  # Dependabot only reads workflow files. The configuration of Renovate is in
  # `renovate.json5`.
  - package-ecosystem: "nix"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      flake-inputs:
        group-by: dependency-name

    # The commits of the repository follow the conventional commits
    # specification, and the check of the CI reads them. The prefix turns the
    # commits of Dependabot into conventional ones: the type is "chore" and
    # the scope is "repo", because a lock file is not an application.
    #
    # The prefix of the scope of the dependency cannot be used: the scope it
    # writes is "deps", and CoCoGitto rejects it.
    commit-message:
      prefix: "chore(repo)"
