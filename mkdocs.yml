site_name: BlueForest Theme
site_url: https://alonsodomin.github.io/blueforest-theme/
repo_url: https://github.com/alonsodomin/blueforest-theme
repo_name: alonsodomin/blueforest-theme
edit_uri: edit/master/docs/
site_author: A. Alonso Dominguez
copyright: Copyright &copy; 2019-2026 A. Alonso Dominguez

nav:
  - Home: index.md
  - Installation: installation.md
  - Themes:
      - Overview: themes/index.md
      - VS Code: themes/vscode.md
      - bat: themes/bat.md
      - Neovim: themes/neovim.md
      - Starship: themes/starship.md
      - OpenCode: themes/opencode.md
      - sbt: themes/sbt.md
      - eza: themes/eza.md
      - Zed: themes/zed.md
      - Yazi: themes/yazi.md
      - kitty: themes/kitty.md
  - Reference:
      - Outputs: reference/outputs.md
      - Identifiers: reference/identifiers.md
  - Hacking:
      - Overview: hacking/index.md
      - Repository layout: hacking/repository.md
      - Development: hacking/development.md
      - Workflows: hacking/workflows.md
      - Releases: hacking/releases.md
      - Adding an application: hacking/adding-an-application.md
  - License: license.md

theme:
  name: material
  language: en
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search

validation:
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
