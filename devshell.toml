# The module that installs the git hooks of the development shell.
imports = ["git/hooks"]

[devshell]
name = "blueforest"
# The tools of the repository: the ones the release needs, the ones that try
# out the theme of an application, and the ones that format its sources.
packages = [
  "btop",
  "cocogitto",
  "coreutils",
  "curl",
  "eza",
  "gawk",
  "gh",
  "git",
  "gnugrep",
  "gnused",
  "jq",
  "kitty",
  "lazygit",
  "md-tui",
  "neovim",
  "opencode",
  "sbt",
  "starship",
  "stylua",
  "taplo",
  "tokei",
  "yazi",
]

[[commands]]
name = "release"
category = "utilities"
help = "Release the repository"
command = '''
  exec blueforest-release "$@"
'''

[[commands]]
name = "changelog"
category = "utilities"
help = "Show the changelog of the changes that are not released yet"
command = '''
  exec blueforest-changelog "$@"
'''

[[commands]]
name = "update"
category = "utilities"
help = "Update the lock files of the repository and of every application"
command = '''
  exec "${PRJ_ROOT:-.}/tools/update.sh" "$@"
'''

[[commands]]
name = "generate-docs"
category = "documentation"
help = "Generate the documentation site"
command = '''
  exec "${PRJ_ROOT:-.}/tools/docs.sh" generate "$@"
'''

[[commands]]
name = "serve-docs"
category = "documentation"
help = "Serve the documentation site locally"
command = '''
  exec "${PRJ_ROOT:-.}/tools/docs.sh" serve "$@"
'''

[[commands]]
name = "watch-docs"
category = "documentation"
help = "Serve the documentation site and generate it again on every change"
command = '''
  exec "${PRJ_ROOT:-.}/tools/docs.sh" watch "$@"
'''

[[commands]]
package = "nixfmt"
category = "formatters"
help = "Nix code formatter"

# The workflows of the repository are rendered from their definitions in
# `workflows/`, so they are rendered again on every commit.
[git.hooks]
enable = true

[git.hooks.pre-commit]
text = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cd "$(git rev-parse --show-toplevel)"
  nix run .#render-workflows
  git add .github/workflows
'''

# The guard of the tags: a tag of a release is made by the release helper,
# which writes the changelog of the release with it.
[git.hooks.pre-push]
text = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cd "$(git rev-parse --show-toplevel)"
  exec ./tools/git-guard/main.sh
'''
