# The module that installs the git hooks of the development shell.
imports = ["git/hooks"]

[devshell]
name = "blueforest"
# The tools of the repository: the ones the release needs, the ones that try
# out the theme of an application, and the ones that format its sources.
packages = [
  "coreutils",
  "gawk",
  "gnused",
  "gnugrep",
  "git",
  "curl",
  "jq",
  "gh",
  "tokei",
  "nodejs_24",
  "vsce",
  "neovim",
  "stylua",
  "starship",
  "taplo",
  "opencode",
  "sbt",
]

[[commands]]
name = "release"
category = "utilities"
help = "Interactive release helper"
command = '''
  exec "${PRJ_ROOT:-.}/tools/release.sh" "$@"
'''

[[commands]]
name = "update"
category = "utilities"
help = "Update the lock files of the repository and of every application"
command = '''
  exec "${PRJ_ROOT:-.}/tools/update.sh" "$@"
'''

[[commands]]
name = "package"
category = "utilities"
help = "Build the .vsix extension package"
command = '''
  set -euo pipefail
  root="${PRJ_ROOT:-.}"
  version="$(bash "$root/tools/version.sh" --package)"
  work="$(mktemp -d)"
  trap 'rm -rf "$work"' EXIT
  cp -r "$root/modules/vscode/." "$work"
  cd "$work"
  jq --indent 2 --arg version "$version" '.version = $version' package.json >package.json.tmp
  mv package.json.tmp package.json
  pkg="$(node -p "require('./package.json').name")"
  out="${pkg}-${version}.vsix"
  echo "Building ${out}"
  vsce package --out "${out}"
  mv "$out" "$root/"
'''

[[commands]]
package = "nixfmt"
category = "formatters"
help = "Nix code formatter"

# The workflows of the repository are rendered from their definitions in
# `workflows/`, so they are rendered again on every commit.
[git.hooks]
enable = true

[git.hooks.pre-commit]
text = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cd "$(git rev-parse --show-toplevel)"
  nix run .#render-workflows
  git add .github/workflows
'''
